<title>Jigging Analysis</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>
<script type="text/babel" data-presets="react">
(function () {
  "use strict";
  var useState = React.useState, useEffect = React.useEffect, useMemo = React.useMemo;

  function statusColorKey(status) {
    var s = (status || "").toLowerCase();
    if (s.indexOf("review hold") !== -1) return "yellow";
    if (s.indexOf("item demand") !== -1) return "red";
    if (s.indexOf("quantity") !== -1 || s.indexOf("quality") !== -1) return "red";
    if (s.indexOf("success") !== -1) return "green";
    return "";
  }

  // Profiles are named "<category> <jig name> (<number>)", e.g.
  // "Cau Hung 3_letter_jig (6)" - or just "<category> <number>" when no
  // jig name was used. Strips the category prefix and the trailing
  // instance number/parens to recover just the jig name.
  function extractJigName(profile, category) {
    var p = (profile || "").trim();
    var lowerP = p.toLowerCase();
    var lowerCat = (category || "").toLowerCase();
    var rest = p;
    if (lowerCat && lowerP.indexOf(lowerCat) === 0) rest = p.slice(category.length).trim();
    rest = rest.replace(/\(\s*\d+\s*\)\s*$/, "").trim();
    rest = rest.replace(/\d+\s*$/, "").trim();
    return rest || "(no jig)";
  }

  function flattenChannelIds(guilds) {
    var ids = [];
    guilds.forEach(function (g) {
      g.categories.forEach(function (cat) {
        cat.channels.forEach(function (ch) { ids.push(ch.id); });
      });
    });
    return ids;
  }

  function channelNamesById(guilds) {
    var names = {};
    guilds.forEach(function (g) {
      g.categories.forEach(function (cat) {
        cat.channels.forEach(function (ch) { names[ch.id] = ch.name; });
      });
    });
    return names;
  }

  function CategoryGroup(props) {
    var cat = props.category;
    var selected = props.selected;
    var allSelected = cat.channels.length > 0 && cat.channels.every(function (ch) { return selected.has(ch.id); });
    return (
      <div className="category-group">
        <label className="category-header">
          <input
            type="checkbox" checked={allSelected}
            onChange={function () { props.onToggleCategory(cat, !allSelected); }}
          />
          {cat.name}
        </label>
        <div className="channel-list">
          {cat.channels.map(function (ch) {
            return (
              <label className="channel-row" key={ch.id}>
                <input
                  type="checkbox" checked={selected.has(ch.id)}
                  onChange={function () { props.onToggleChannel(ch.id); }}
                />
                <span className="channel-hash">#</span>
                {ch.name}
              </label>
            );
          })}
        </div>
      </div>
    );
  }

  function ScanProgress(props) {
    var progress = props.progress;
    if (!progress) return null;
    if (progress.error) return <p className="muted small" style={{ margin: 0 }}>{"Error: " + progress.error}</p>;

    // A channel not yet in progress.channels hasn't been reached by the scan
    // loop yet - "Queued…". Once reached, its entry holds live counts that
    // get replaced with the final ones when that channel's scan finishes;
    // there's no separate per-channel "done" flag, only the overall status.
    var channels = (props.selectedChannels || []).map(function (sel) {
      return Object.assign({ id: sel.id, name: sel.name }, progress.channels && progress.channels[sel.id]);
    });
    var totals = channels.reduce(function (acc, c) {
      acc.messages += c.seen || 0;
      acc.orders += c.orders || 0;
      acc.newRecords += c.new || 0;
      return acc;
    }, { messages: 0, orders: 0, newRecords: 0 });

    return (
      <div className="scan-progress">
        {channels.map(function (c) {
          var label = c.error ? "Error: " + c.error
            : c.seen == null ? "Queued…"
            : c.seen + " msgs scanned, " + c.orders + " orders (" + c.new + " new)" + (c.rejected ? ", " + c.rejected + " unrecognized" : "");
          return (
            <div className="scan-channel-row" key={c.id}>
              <span className="scan-channel-name">{"#" + c.name}</span>
              <span className="scan-channel-stats">{label}</span>
            </div>
          );
        })}
        <div className="scan-summary">
          <div className="scan-stat"><div className="scan-stat-value">{totals.messages}</div><div className="scan-stat-label">Messages scanned</div></div>
          <div className="scan-stat"><div className="scan-stat-value">{totals.orders}</div><div className="scan-stat-label">Orders found</div></div>
          <div className="scan-stat"><div className="scan-stat-value">{totals.newRecords}</div><div className="scan-stat-label">New records</div></div>
          <div className="scan-stat"><div className="scan-stat-value">{progress.status === "done" ? "Done" : "Running…"}</div><div className="scan-stat-label">Status</div></div>
        </div>
      </div>
    );
  }

  // ---------- single-calendar date-range picker ----------

  var MONTH_NAMES = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var DAY_LABELS = ["S", "M", "T", "W", "T", "F", "S"];

  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function toIso(y, m, d) { return y + "-" + pad2(m + 1) + "-" + pad2(d); }
  function parseIso(iso) {
    if (!iso) return null;
    var parts = iso.split("-");
    return { y: parseInt(parts[0], 10), m: parseInt(parts[1], 10) - 1, d: parseInt(parts[2], 10) };
  }
  function formatDisplay(iso) {
    var p = parseIso(iso);
    if (!p) return "";
    return MONTH_NAMES[p.m].slice(0, 3) + " " + p.d + ", " + p.y;
  }
  function buildCalendarWeeks(year, month) {
    var firstDay = new Date(year, month, 1).getDay();
    var numDays = new Date(year, month + 1, 0).getDate();
    var cells = [];
    for (var i = 0; i < firstDay; i++) cells.push(null);
    for (var d = 1; d <= numDays; d++) cells.push(d);
    while (cells.length % 7 !== 0) cells.push(null);
    var weeks = [];
    for (var i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
    return weeks;
  }

  function DateRangePicker(props) {
    var today = new Date();
    var initial = parseIso(props.after) || { y: today.getFullYear(), m: today.getMonth() };
    var s = useState({ y: initial.y, m: initial.m });
    var view = s[0], setView = s[1];

    var todayIso = toIso(today.getFullYear(), today.getMonth(), today.getDate());
    var weeks = buildCalendarWeeks(view.y, view.m);

    function handleDayClick(day) {
      var iso = toIso(view.y, view.m, day);
      if (!props.after || props.before) {
        props.onChange(iso, "");
      } else if (iso < props.after) {
        props.onChange(iso, props.after);
        if (props.onDone) props.onDone();
      } else {
        props.onChange(props.after, iso);
        if (props.onDone) props.onDone();
      }
    }

    function prevMonth() { setView(function (v) { var m = v.m - 1, y = v.y; if (m < 0) { m = 11; y--; } return { y: y, m: m }; }); }
    function nextMonth() { setView(function (v) { var m = v.m + 1, y = v.y; if (m > 11) { m = 0; y++; } return { y: y, m: m }; }); }

    return (
      <div className="date-range-panel">
        <div className="date-range-header">
          <button type="button" className="btn btn-ghost date-nav" onClick={prevMonth}>‹</button>
          <span className="date-range-title">{MONTH_NAMES[view.m] + " " + view.y}</span>
          <button type="button" className="btn btn-ghost date-nav" onClick={nextMonth}>›</button>
        </div>
        <div className="date-grid">
          {DAY_LABELS.map(function (l, i) { return <span className="date-cell-label" key={i}>{l}</span>; })}
        </div>
        {weeks.map(function (week, wi) {
          return (
            <div className="date-grid" key={wi}>
              {week.map(function (day, di) {
                if (!day) return <span className="date-cell date-cell-empty" key={di} />;
                var iso = toIso(view.y, view.m, day);
                var inRange = props.after && props.before && iso >= props.after && iso <= props.before;
                var isEdge = iso === props.after || iso === props.before;
                var cls = "date-cell date-cell-day";
                if (inRange) cls += " date-cell-inrange";
                if (isEdge) cls += " date-cell-selected";
                if (iso === todayIso) cls += " date-cell-today";
                return (
                  <button
                    type="button" key={di} className={cls}
                    onClick={function () { handleDayClick(day); }}
                  >{day}</button>
                );
              })}
            </div>
          );
        })}
        <div className="date-range-footer">
          <button type="button" className="btn btn-ghost" onClick={function () { props.onChange("", ""); }}>Clear</button>
        </div>
      </div>
    );
  }

  function App() {
    var s1 = useState(null); var data = s1[0], setData = s1[1]; // raw API response
    var s2 = useState(true); var loading = s2[0], setLoading = s2[1];
    var s3 = useState(new Set()); var selected = s3[0], setSelected = s3[1];
    var s4 = useState(""); var saveStatus = s4[0], setSaveStatus = s4[1];
    var s5 = useState(false); var saving = s5[0], setSaving = s5[1];
    var s6 = useState(null); var scanProgress = s6[0], setScanProgress = s6[1];
    var s8 = useState(""); var searchInput = s8[0], setSearchInput = s8[1];
    var s9 = useState(null); var searchResults = s9[0], setSearchResults = s9[1];
    var s10 = useState(false); var searching = s10[0], setSearching = s10[1];
    var s12 = useState(false); var channelDropdownOpen = s12[0], setChannelDropdownOpen = s12[1];
    var s17 = useState(false); var toastVisible = s17[0], setToastVisible = s17[1];
    var s18 = useState(false); var toastLeaving = s18[0], setToastLeaving = s18[1];
    var s19 = useState(""); var searchAfter = s19[0], setSearchAfter = s19[1];
    var s20 = useState(""); var searchBefore = s20[0], setSearchBefore = s20[1];
    var s21 = useState(true); var searchDateDropdownOpen = s21[0], setSearchDateDropdownOpen = s21[1];
    var s22 = useState(""); var searchDateError = s22[0], setSearchDateError = s22[1];
    var s23 = useState(new Set()); var statusFilter = s23[0], setStatusFilter = s23[1];
    var s24 = useState({}); var copyStatus = s24[0], setCopyStatus = s24[1];
    var s25 = useState(new Set()); var categoryFilter = s25[0], setCategoryFilter = s25[1];
    var s26 = useState(false); var statusFilterOpen = s26[0], setStatusFilterOpen = s26[1];
    var s27 = useState(false); var categoryFilterOpen = s27[0], setCategoryFilterOpen = s27[1];
    var s28 = useState([]); var lastSearchTerms = s28[0], setLastSearchTerms = s28[1];
    var s29 = useState(""); var searchPhase = s29[0], setSearchPhase = s29[1];
    var s30 = useState(""); var searchNote = s30[0], setSearchNote = s30[1];
    var s31 = useState(new Set()); var channelFilter = s31[0], setChannelFilter = s31[1];
    var s32 = useState(false); var channelFilterOpen = s32[0], setChannelFilterOpen = s32[1];
    var s33 = useState(""); var jigSearch = s33[0], setJigSearch = s33[1];
    var toastTimers = React.useRef([]);
    var copyTimers = React.useRef({});
    var statusFilterRef = React.useRef(null);
    var categoryFilterRef = React.useRef(null);
    var channelFilterRef = React.useRef(null);

    useEffect(function () {
      function handleClickOutside(e) {
        if (statusFilterRef.current && !statusFilterRef.current.contains(e.target)) setStatusFilterOpen(false);
        if (categoryFilterRef.current && !categoryFilterRef.current.contains(e.target)) setCategoryFilterOpen(false);
        if (channelFilterRef.current && !channelFilterRef.current.contains(e.target)) setChannelFilterOpen(false);
      }
      document.addEventListener("mousedown", handleClickOutside);
      return function () { document.removeEventListener("mousedown", handleClickOutside); };
    }, []);

    function clearToastTimers() {
      toastTimers.current.forEach(function (id) { clearTimeout(id); });
      toastTimers.current = [];
    }

    function scheduleToastHide() {
      clearToastTimers();
      toastTimers.current.push(setTimeout(function () { setToastLeaving(true); }, 2200));
      toastTimers.current.push(setTimeout(function () { setToastVisible(false); setToastLeaving(false); }, 2450));
    }

    function load(silent) {
      if (!silent) setLoading(true);
      fetch("/api/discord/channels")
        .then(function (r) { return r.json(); })
        .then(function (json) {
          setData(json);
          // Silent background refreshes only update the connection/guild info -
          // never the checkbox selection, so they can't clobber channel picks
          // the user is still in the middle of making before hitting Save.
          if (!silent) setSelected(new Set(json.selected || []));
        })
        .catch(function () {
          if (!silent) {
            setData({ connected: false, guilds: [], selected: [], error: "Could not reach Account Analysis's backend." });
          }
        })
        .finally(function () { if (!silent) setLoading(false); });
    }

    useEffect(function () {
      load();
      var interval = setInterval(function () { load(true); }, 15000);
      return function () { clearInterval(interval); };
    }, []);

    useEffect(function () {
      fetch("/api/discord/search-terms")
        .then(function (r) { return r.json(); })
        .then(function (json) {
          if (json.terms && json.terms.length) setSearchInput(json.terms.join(", "));
        })
        .catch(function () {});
    }, []);

    var allIds = useMemo(function () { return data ? flattenChannelIds(data.guilds || []) : []; }, [data]);

    function toggleChannel(id) {
      setSelected(function (prev) {
        var next = new Set(prev);
        if (next.has(id)) next.delete(id); else next.add(id);
        return next;
      });
    }

    function toggleCategory(cat, on) {
      setSelected(function (prev) {
        var next = new Set(prev);
        cat.channels.forEach(function (ch) { if (on) next.add(ch.id); else next.delete(ch.id); });
        return next;
      });
    }

    function selectAll() { setSelected(new Set(allIds)); }
    function clearAll() { setSelected(new Set()); }

    function saveSelection() {
      setSaving(true);
      setSaveStatus("Saving…");
      fetch("/api/discord/channels/selection", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ channel_ids: Array.from(selected) }),
      })
        .then(function (r) { return r.json(); })
        .then(function (json) {
          if (json.error) { setSaveStatus(json.error); return; }
          setSelected(new Set(json.selected || []));
          setSaveStatus("Saved " + (json.selected || []).length + " channel(s).");
        })
        .catch(function () { setSaveStatus("Couldn't save - is Account Analysis still running?"); })
        .finally(function () { setSaving(false); setTimeout(function () { setSaveStatus(""); }, 3000); });
    }

    function scanHasError(progress) {
      if (!progress) return false;
      if (progress.error) return true;
      var channels = progress.channels || {};
      return Object.keys(channels).some(function (id) { return !!channels[id].error; });
    }

    function waitForScan(scanId) {
      return new Promise(function (resolve) {
        function tick() {
          fetch("/api/discord/scan/" + scanId)
            .then(function (r) { return r.json(); })
            .then(function (json) {
              setScanProgress(json);
              if (json.status === "done" || json.error) resolve(json);
              else setTimeout(tick, 1200);
            })
            .catch(function () { resolve({ error: "Lost contact with Account Analysis while scanning." }); });
        }
        tick();
      });
    }

    // Starts a scan and resolves with its final progress (or {error}).
    // Shared by the Scan button and by Search, which scans first.
    function runScan(body) {
      clearToastTimers();
      setToastLeaving(false);
      setToastVisible(true);
      setScanProgress(null);
      return fetch("/api/discord/scan", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      })
        .then(function (r) { return r.json(); })
        .then(function (json) { return json.error ? { error: json.error } : waitForScan(json.scan_id); })
        .catch(function () { return { error: "Could not start scan." }; })
        .then(function (finalProgress) {
          setScanProgress(finalProgress);
          // Keep the popup on screen if anything went wrong instead of
          // auto-hiding it - a scan that stopped partway through (e.g. a
          // channel error) is easy to miss if the toast fades in 2.5s.
          if (!scanHasError(finalProgress)) scheduleToastHide();
          return finalProgress;
        });
    }

    // Search = scan the selected channels for the chosen date range (only
    // what's new when no range is set), then search what's stored.
    function runSearch() {
      // An empty list here means "no profile name given" - the backend
      // treats that as search everything, not search nothing.
      var names = searchInput.split(/[,\n]/).map(function (s) { return s.trim(); }).filter(Boolean);
      if (searchAfter && searchBefore && searchAfter > searchBefore) {
        setSearchDateError("'From' date must be before 'To' date.");
        return;
      }
      setSearchDateError("");
      setSearching(true);

      var canScan = !!(data && data.connected) && selected.size > 0;
      setSearchNote(canScan ? "" : "Not fetching from Discord (" + (selected.size === 0 ? "no channels selected" : "disconnected") + ") - showing saved data.");
      setSearchPhase(canScan ? "scanning" : "searching");

      var scanStep = canScan
        ? runScan({ channel_ids: Array.from(selected), after: searchAfter || null, before: searchBefore || null, incremental: true })
        : Promise.resolve(null);

      scanStep
        .then(function () {
          setSearchPhase("searching");
          return fetch("/api/discord/profiles/search", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ names: names, after: searchAfter || null, before: searchBefore || null }),
          });
        })
        .then(function (r) { return r.json(); })
        .then(function (json) {
          setSearchResults(json);
          var statuses = json && json.profilesPerStatus ? Object.keys(json.profilesPerStatus) : [];
          setStatusFilter(new Set(statuses));
          setLastSearchTerms(names);
          setCategoryFilter(new Set(names));
          var channels = new Set();
          Object.values((json && json.channelsPerProfile) || {}).forEach(function (chs) {
            chs.forEach(function (c) { channels.add(c); });
          });
          setChannelFilter(channels);
        })
        .catch(function () { setSearchResults({ error: "Search failed - is Account Analysis still running?" }); })
        .finally(function () { setSearching(false); setSearchPhase(""); });
    }

    function toggleStatusFilter(status) {
      setStatusFilter(function (prev) {
        var next = new Set(prev);
        if (next.has(status)) next.delete(status); else next.add(status);
        return next;
      });
    }

    // Which of the searched keywords (e.g. "Co Mary", "Kem") a profile name
    // matches - a profile can belong to more than one category if its name
    // happens to contain more than one searched term.
    function profileCategories(profile) {
      var p = (profile || "").toLowerCase();
      return lastSearchTerms.filter(function (term) { return p.indexOf(term.toLowerCase()) !== -1; });
    }

    // The jig name(s) a profile would show under in Jig Breakdown - one per
    // matched category (extractJigName strips that category's own prefix),
    // or a single best-effort name when it matched no category at all.
    function profileJigNames(profile) {
      var cats = profileCategories(profile);
      if (!cats.length) return [extractJigName(profile, "")];
      return cats.map(function (cat) { return extractJigName(profile, cat); });
    }

    function matchesJigSearch(profile) {
      var jq = jigSearch.trim().toLowerCase();
      if (!jq) return true;
      return profileJigNames(profile).some(function (name) { return name.toLowerCase().indexOf(jq) !== -1; });
    }

    function toggleCategoryFilter(term) {
      setCategoryFilter(function (prev) {
        var next = new Set(prev);
        if (next.has(term)) next.delete(term); else next.add(term);
        return next;
      });
    }

    // Which channel(s) a profile's orders came from - real stored data (not
    // guessed from the name), so it filters correctly even across servers.
    function profileChannels(profile) {
      return (searchResults && searchResults.channelsPerProfile && searchResults.channelsPerProfile[profile]) || [];
    }

    function toggleChannelFilter(channel) {
      setChannelFilter(function (prev) {
        var next = new Set(prev);
        if (next.has(channel)) next.delete(channel); else next.add(channel);
        return next;
      });
    }

    function copyProfiles(status, profiles) {
      if (!profiles.length) return;
      var text = profiles.join("\n");

      function legacyCopy() {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
        document.body.removeChild(ta);
        return ok;
      }

      function showResult(ok) {
        var message = ok ? "Copied " + profiles.length : "Couldn't copy";
        setCopyStatus(function (prev) { var next = Object.assign({}, prev); next[status] = message; return next; });
        if (copyTimers.current[status]) clearTimeout(copyTimers.current[status]);
        copyTimers.current[status] = setTimeout(function () {
          setCopyStatus(function (prev) { var next = Object.assign({}, prev); delete next[status]; return next; });
        }, 2000);
      }

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { showResult(true); }, function () { showResult(legacyCopy()); });
      } else {
        showResult(legacyCopy());
      }
    }

    var connected = data && data.connected;
    var guilds = (data && data.guilds) || [];
    var categoryCounts = useMemo(function () {
      var counts = {};
      lastSearchTerms.forEach(function (term) { counts[term] = new Set(); });
      if (searchResults && !searchResults.error) {
        Object.keys(searchResults.profilesPerStatus).forEach(function (status) {
          searchResults.profilesPerStatus[status].forEach(function (p) {
            profileCategories(p).forEach(function (term) { counts[term].add(p); });
          });
        });
      }
      var out = {};
      Object.keys(counts).forEach(function (term) { out[term] = counts[term].size; });
      return out;
    }, [searchResults, lastSearchTerms]);

    var channelCounts = useMemo(function () {
      var counts = {};
      if (searchResults && !searchResults.error && searchResults.channelsPerProfile) {
        Object.keys(searchResults.channelsPerProfile).forEach(function (profile) {
          searchResults.channelsPerProfile[profile].forEach(function (ch) {
            counts[ch] = counts[ch] || new Set();
            counts[ch].add(profile);
          });
        });
      }
      var out = {};
      Object.keys(counts).forEach(function (ch) { out[ch] = counts[ch].size; });
      return out;
    }, [searchResults]);
    var allChannels = useMemo(function () { return Object.keys(channelCounts).sort(); }, [channelCounts]);

    var jigBreakdown = useMemo(function () {

      if (!searchResults || searchResults.error) return result;
      Object.keys(searchResults.profilesPerStatus).forEach(function (status) {

          // No search terms (search-all) means there are no categories to
          // group by at all - fall back to one entry per profile, same as
          // profileJigNames() does, instead of silently producing nothing.
          var cats = profileCategories(profile);
          var categories = cats.length ? cats : lastSearchTerms.length === 0 ? [""] : [];
          categories.forEach(function (category) {
            if (lastSearchTerms.length > 0 && !categoryFilter.has(category)) return;
            var jig = extractJigName(profile, category);
            var jq = jigSearch.trim().toLowerCase();
            if (jq && jig.toLowerCase().indexOf(jq) === -1) return;
            result[category] = result[category] || {};
            result[category][jig] = result[category][jig] || {};
            result[category][jig][status] = (result[category][jig][status] || 0) + 1;
          });
        });
      });
      return result;
    }, [searchResults, statusFilter, categoryFilter, channelFilter, lastSearchTerms, jigSearch]);

    return (
      <div className="app-shell">
        <nav className="page-nav">
          <a className="page-nav-link" href="/">Account Analysis</a>
          <a className="page-nav-link page-nav-active" href="/discord.html">Jigging Analysis</a>
          <a className="page-nav-link" href="/profile-finder.html">Profile Finder</a>
          <a className="page-nav-link" href="/account-finder.html">Account Finder</a>
        </nav>
        <header className="topbar">
          <div className="brand">
            <span className="brand-mark">OL</span>
            <div>
              <h1 className="brand-title">Jigging Analysis</h1>
              <p className="brand-tag">Track order notifications posted in Discord as a second data source, kept separate from CSV accounts.</p>
            </div>
          </div>
        </header>

        <div>
          <div className="status-pill">
            <span className={"status-dot " + (connected ? "status-dot-on" : "status-dot-off")}></span>
            <span className="status-text">{loading ? "Checking…" : connected ? "Discord Connected" : "Discord Disconnected"}</span>
            <button
              className={"icon-btn" + (loading ? " icon-btn-spin" : "")}
              onClick={function () { load(); }} disabled={loading} title="Refresh connection status" type="button"
            >↻</button>
          </div>
          {!loading && !connected ? (
            <p className="muted small" style={{ margin: "6px 0 0" }}>
              {(data && data.error)
                ? "Error: " + data.error
                : "Make sure DISCORD_TOKEN is set in your .env file, the required packages are installed (pip install -r requirements.txt), and Account Analysis has been restarted."}
            </p>
          ) : null}
        </div>

        <div className="workspace">
          <aside className="sidebar">
            <div className="sidebar-card">
              <h2 className="sidebar-title">Select Discord Channels</h2>
              {loading ? <p className="muted small" style={{ margin: 0 }}>Loading…</p>
                : !connected ? <p className="muted small" style={{ margin: 0 }}>Not connected.</p>
                : guilds.length === 0 ? <p className="muted small" style={{ margin: 0 }}>No accessible channels.</p>
                : (
                  <React.Fragment>
                    <button
                      className="btn dropdown-trigger"
                      onClick={function () { setChannelDropdownOpen(!channelDropdownOpen); }}
                    >
                      {selected.size + " channel" + (selected.size === 1 ? "" : "s") + " selected"}
                      <span className={"chevron" + (channelDropdownOpen ? " chevron-open" : "")}>▾</span>
                    </button>
                    {channelDropdownOpen ? (
                      <div className="dropdown-panel scroll-box">
                        <div className="selector-actions">
                          <button className="btn btn-ghost" onClick={selectAll}>Select All</button>
                          <button className="btn btn-ghost" onClick={clearAll}>Clear All</button>
                        </div>
                        {guilds.map(function (g) {
                          return (
                            <div className="guild-block" key={g.id}>
                              <h3 className="guild-name">{g.name}</h3>
                              {g.categories.map(function (cat) {
                                return (
                                  <CategoryGroup
                                    key={cat.id} category={cat} selected={selected}
                                    onToggleChannel={toggleChannel} onToggleCategory={toggleCategory}
                                  />
                                );
                              })}
                            </div>
                          );
                        })}
                      </div>
                    ) : null}
                    <button className="btn btn-primary btn-block" onClick={saveSelection} disabled={saving}>{saving ? "Saving…" : "Save Selection"}</button>
                    {saveStatus ? <p className="save-status" style={{ margin: 0 }}>{saveStatus}</p> : null}
                  </React.Fragment>
                )}
            </div>

            {searchResults && !searchResults.error && searchResults.ordersPerProxyHost && Object.keys(searchResults.ordersPerProxyHost).length > 0 ? (
              <div className="sidebar-card">
                <h2 className="sidebar-title">Proxy Speed</h2>
                <p className="panel-hint" style={{ margin: 0 }}>Orders captured per provider, any status.</p>
                <div className="proxy-chart">
                  {(function () {
                    var hosts = Object.keys(searchResults.ordersPerProxyHost);
                    var maxCount = Math.max.apply(null, hosts.map(function (h) { return searchResults.ordersPerProxyHost[h]; }));
                    return hosts.map(function (host, i) {
                      var count = searchResults.ordersPerProxyHost[host];
                      var pct = maxCount > 0 ? Math.max(4, Math.round((count / maxCount) * 100)) : 0;
                      return (
                        <div className="proxy-bar-row" key={host}>
                          <span className="proxy-bar-label" title={host}>{(i + 1) + ". " + host}</span>
                          <div className="proxy-bar-track-row">
                            <div className="proxy-bar-track">
                              <div className="proxy-bar-fill" style={{ width: pct + "%" }}></div>
                            </div>
                            <span className="proxy-bar-count">{count}</span>
                          </div>
                        </div>
                      );
                    });
                  })()}
                </div>
              </div>
            ) : null}
          </aside>

          <div className="main-results">
            <div className="card">
              <h2 className="panel-title">Search Profiles</h2>
              <div className="search-row">
                <input
                  type="text" className="search-input-inline" placeholder="Co Mary, John Smith (leave blank for all)"
                  value={searchInput}
                  onChange={function (e) { setSearchInput(e.target.value); }}
                  onKeyDown={function (e) { if (e.key === "Enter") runSearch(); }}
                />
                <button className="btn btn-primary" onClick={runSearch} disabled={searching}>{searchPhase === "scanning" ? "Scanning…" : searching ? "…" : "Search"}</button>
              </div>
              <p className="panel-hint" style={{ margin: 0 }}>Comma-separated, partial names OK. Leave blank to search every profile. Search fetches new Discord messages for the date range first.</p>
              {searchNote ? <p className="muted small" style={{ margin: 0 }}>{searchNote}</p> : null}
              <div className="date-picker-wrap">
                <button
                  className="btn dropdown-trigger" type="button"
                  onClick={function () { setSearchDateDropdownOpen(!searchDateDropdownOpen); }}
                >
                  {(searchAfter || searchBefore)
                    ? (formatDisplay(searchAfter) + " – " + (searchBefore ? formatDisplay(searchBefore) : "…"))
                    : "All history"}
                  <span className={"chevron" + (searchDateDropdownOpen ? " chevron-open" : "")}>▾</span>
                </button>
                {searchDateDropdownOpen ? (
                  <DateRangePicker
                    after={searchAfter} before={searchBefore}
                    onChange={function (a, b) { setSearchAfter(a); setSearchBefore(b); setSearchDateError(""); }}
                    onDone={function () { setSearchDateDropdownOpen(false); }}
                  />
                ) : null}
              </div>
              {searchDateError ? <p className="muted small" style={{ margin: 0, color: "var(--stamp-cancel)" }}>{searchDateError}</p> : null}
              {searchResults && searchResults.error ? <p className="muted small" style={{ margin: 0 }}>{searchResults.error}</p> : null}
              {searchResults && searchResults.countPerSearchTerm && Object.values(searchResults.countPerSearchTerm).some(function (n) { return n === 0; })
                ? (
                  <p className="muted small" style={{ margin: 0, color: "var(--stamp-cancel)" }}>
                    {"⚠ matched 0 orders: " + Object.keys(searchResults.countPerSearchTerm)
                      .filter(function (term) { return searchResults.countPerSearchTerm[term] === 0; })
                      .map(function (term) { return "\"" + term + "\""; }).join(", ")}
                  </p>
                )
                : null}
            </div>

            {searchResults && !searchResults.error ? (
              <section className="card">
                <h2 className="panel-title">Search Results</h2>
                {Object.keys(searchResults.profilesPerStatus).length === 0
                  ? <p className="muted small" style={{ margin: 0 }}>No matching orders found.</p>
                  : (
                    <React.Fragment>
                      <div className="result-filter-row">
                        <input
                          type="search" className="jig-search-input" placeholder="Search jig…"
                          value={jigSearch} onChange={function (e) { setJigSearch(e.target.value); }}
                          aria-label="Search by jig name"
                        />
                        <div className="result-filter" ref={statusFilterRef}>
                          <button
                            className="btn dropdown-trigger" type="button"
                            onClick={function () { setStatusFilterOpen(!statusFilterOpen); }}
                          >
                            {statusFilter.size + " of " + Object.keys(searchResults.profilesPerStatus).length + " statuses"}
                            <span className={"chevron" + (statusFilterOpen ? " chevron-open" : "")}>▾</span>
                          </button>
                          {statusFilterOpen ? (
                            <div className="dropdown-panel scroll-box">
                              <div className="selector-actions">
                                <button className="btn btn-ghost" onClick={function () { setStatusFilter(new Set(Object.keys(searchResults.profilesPerStatus))); }}>Select All</button>
                                <button className="btn btn-ghost" onClick={function () { setStatusFilter(new Set()); }}>Clear All</button>
                              </div>
                              {Object.keys(searchResults.profilesPerStatus).map(function (status) {
                                var colorKey = statusColorKey(status) || "neutral";
                                return (
                                  <label className="filter-option" key={status}>
                                    <input type="checkbox" checked={statusFilter.has(status)} onChange={function () { toggleStatusFilter(status); }} />
                                    <span className={"status-color-dot status-color-" + colorKey}></span>
                                    {status + " (" + searchResults.profilesPerStatus[status].length + ")"}
                                  </label>
                                );
                              })}
                            </div>
                          ) : null}
                        </div>
                        {lastSearchTerms.length > 0 ? (
                          <div className="result-filter" ref={categoryFilterRef}>
                            <button
                              className="btn dropdown-trigger" type="button"
                              onClick={function () { setCategoryFilterOpen(!categoryFilterOpen); }}
                            >
                              {categoryFilter.size + " of " + lastSearchTerms.length + " keywords"}
                              <span className={"chevron" + (categoryFilterOpen ? " chevron-open" : "")}>▾</span>
                            </button>
                            {categoryFilterOpen ? (
                              <div className="dropdown-panel scroll-box">
                                <div className="selector-actions">
                                  <button className="btn btn-ghost" onClick={function () { setCategoryFilter(new Set(lastSearchTerms)); }}>Select All</button>
                                  <button className="btn btn-ghost" onClick={function () { setCategoryFilter(new Set()); }}>Clear All</button>
                                </div>
                                {lastSearchTerms.map(function (term) {
                                  return (
                                    <label className="filter-option" key={term}>
                                      <input type="checkbox" checked={categoryFilter.has(term)} onChange={function () { toggleCategoryFilter(term); }} />
                                      {term + " (" + (categoryCounts[term] || 0) + ")"}
                                    </label>
                                  );
                                })}
                              </div>
                            ) : null}
                          </div>
                        ) : null}
                        <div className="result-filter" ref={channelFilterRef}>
                          <button
                            className="btn dropdown-trigger" type="button"
                            onClick={function () { setChannelFilterOpen(!channelFilterOpen); }}
                          >
                            {channelFilter.size + " of " + allChannels.length + " channels"}
                            <span className={"chevron" + (channelFilterOpen ? " chevron-open" : "")}>▾</span>
                          </button>
                          {channelFilterOpen ? (
                            <div className="dropdown-panel scroll-box">
                              <div className="selector-actions">
                                <button className="btn btn-ghost" onClick={function () { setChannelFilter(new Set(allChannels)); }}>Select All</button>
                                <button className="btn btn-ghost" onClick={function () { setChannelFilter(new Set()); }}>Clear All</button>
                              </div>
                              {allChannels.map(function (channelName) {
                                return (
                                  <label className="filter-option" key={channelName}>
                                    <input type="checkbox" checked={channelFilter.has(channelName)} onChange={function () { toggleChannelFilter(channelName); }} />
                                    {"#" + channelName + " (" + (channelCounts[channelName] || 0) + ")"}
                                  </label>
                                );
                              })}
                            </div>
                          ) : null}
                        </div>
                      </div>
                      {Object.keys(jigBreakdown).length > 0 ? (
                        <div className="status-group">
                          <div className="status-group-header">Jig Breakdown</div>
                          {Object.keys(jigBreakdown).sort().map(function (category) {
                            var jigs = jigBreakdown[category];
                            return (
                              <div key={category} style={{ display: "flex", flexDirection: "column", gap: "4px" }}>
                                <div className="jig-category-name">{category || "All Profiles"}</div>
                                {Object.keys(jigs).sort().map(function (jigName) {
                                  var counts = jigs[jigName];
                                  return (
                                    <div className="jig-row" key={jigName}>
                                      <div className="jig-stats">
                                        {Object.keys(counts).sort().map(function (status) {
                                          var colorKey = statusColorKey(status) || "neutral";
                                          return (
                                            <div className={"jig-stat-line jig-stat-" + colorKey} key={status}>
                                              <span className="jig-stat-status">
                                                <span className="jig-name">{jigName}</span>: {status}
                                              </span>
                                              <span className="jig-stat-count">{"(" + counts[status] + ")"}</span>
                                            </div>
                                          );
                                        })}
                                      </div>
                                    </div>
                                  );
                                })}
                              </div>
                            );
                          })}
                        </div>
                      ) : null}
                      <div className="scan-progress">
                        {Object.keys(searchResults.profilesPerStatus).filter(function (status) { return statusFilter.has(status); }).map(function (status) {
                          var profiles = searchResults.profilesPerStatus[status].filter(function (p) {
                            var matchesCategory = lastSearchTerms.length === 0 ||
                              profileCategories(p).some(function (term) { return categoryFilter.has(term); });
                            return matchesCategory && profileChannels(p).some(function (ch) { return channelFilter.has(ch); }) && matchesJigSearch(p);
                          });
                          if (!profiles.length) return null;
                          var colorKey = statusColorKey(status) || "neutral";
                          return (
                            <div className={"status-group status-group-" + colorKey} key={status}>
                              <div className="status-group-header-row">
                                <div className="status-group-header">{status + " (" + profiles.length + ")"}</div>
                                <div className="status-group-header-actions">
                                  {copyStatus[status] ? <span className="muted small">{copyStatus[status]}</span> : null}
                                  <button
                                    type="button" className="btn btn-ghost small"
                                    onClick={function () { copyProfiles(status, profiles); }}
                                  >Copy</button>
                                </div>
                              </div>
                              <div className="profile-chip-row">
                                {profiles.map(function (p) {
                                  return <span key={p} className="profile-chip">{p}</span>;
                                })}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </React.Fragment>
                  )}
              </section>
            ) : null}

            {!searchResults ? <div className="empty-state">Search a profile or run a scan to see results here.</div> : null}
          </div>
        </div>

        <footer className="footer-note">Discord data stays local to this machine, in memory only - nothing is saved, so it's gone when the app restarts.</footer>

        {toastVisible && scanProgress ? (
          <div className={"toast-wrap card" + (toastLeaving ? " toast-leaving" : "")}>
            <h2 className="panel-title">Scan Progress</h2>
            <ScanProgress
              progress={scanProgress}
              selectedChannels={Array.from(selected).map(function (id) { return { id: id, name: channelNamesById(guilds)[id] || id }; })}
            />
          </div>
        ) : null}
      </div>
    );
  }

  var rootEl = document.getElementById("root");
  ReactDOM.createRoot(rootEl).render(<App />);
})();
</script>
